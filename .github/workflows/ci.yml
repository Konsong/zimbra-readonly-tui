name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Version
        run: shellcheck --version
      - name: Lint every script, tests and mocks included
        run: |
          shellcheck zimbra-ro-tui.sh lib/*.sh tests/*.sh tests/lib/*.sh \
                     tests/mocks/*.sh tests/mocks/bin/* tests/mocks/libexec/* \
                     tests/mocks/system/* tests/mocks/sbin/*

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash version
        run: bash --version
      - name: Run the suite
        run: ./tests/run.sh

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo is developed on Windows, where core.autocrlf rewrites line
      # endings. A CRLF in a shell script becomes `bad interpreter` on the
      # Zimbra host, so this is checked rather than trusted to .gitattributes.
      - name: Reject CRLF in shell scripts
        run: |
          if grep -rlI $'\r' --include='*.sh' . ; then
            echo "CRLF line endings found; see .gitattributes" >&2
            exit 1
          fi
